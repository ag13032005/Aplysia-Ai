[build]
  functions = "netlify/functions"
  publish = "static"

[build.environment]
  PYTHON_VERSION = "3.10"

[functions]
  included_files = [
    "best.pkl",
    "templates/**",
    "static/**",
    "app.py"
  ]

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true

